name: random-restaurant

services:
  # MySQL
  mysql:
    container_name: mysql8
    image: mysql:8.0
    restart: always
    command: > 
      mysqld 
      --default-authentication-plugin=mysql_native_password 
      --character-set-server=utf8mb4 
      --collation-server=utf8mb4_general_ci 
      --log_bin_trust_function_creators=1 
      --lower_case_table_names=2 
      --federated
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
      MAX_ALLOWED_PACKET: 1072731136
    ports:
      - '${DB_PORT}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - './docker/mysql8/init:/docker-entrypoint-initdb.d:ro'

  app:
    container_name: random-restaurant-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '${PORT}:${PORT}'
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: ${PORT}
    depends_on:
      - mysql

volumes:
  mysql-data:
    driver: local